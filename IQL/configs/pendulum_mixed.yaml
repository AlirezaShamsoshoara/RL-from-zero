# IQL on Pendulum-v1 with a "mixed" (medium) offline dataset.
# The dataset is collected once from a noisy energy-shaping swing-up controller
# mixed with random episodes (a medium-quality behavior policy, return ~ -500).
# IQL learns from this fixed dataset with no environment interaction and should
# extract a policy better than the behavior that produced the data.
project: rl-hero
entity: null
run_name: iql-pendulum-mixed
wandb_key: ""  # optional API key for wandb login (or set WANDB_API_KEY)
env_id: Pendulum-v1
seed: 42

# Dataset
dataset_source: mixed  # random | mixed | npz | d4rl
dataset_steps: 60000
normalize_rewards: false

# Training
total_updates: 80000
batch_size: 256
gamma: 0.99
tau: 0.005
expectile: 0.7
temperature: 3.0
max_weight: 100.0
actor_lr: 0.0003
critic_lr: 0.0003
value_lr: 0.0003
hidden_sizes: [256, 256]
activation: relu

# Logging & checkpoints
log_interval: 1000
eval_interval: 10000
eval_episodes: 10
checkpoint_interval: 40000
checkpoint_dir: IQL/checkpoints_mixed
save_best: true
log_level: INFO
log_to_file: true
log_file: IQL/logs/iql_mixed.log
log_to_console: true

# Evaluation / inference
inference_model_path: IQL/checkpoints_mixed/best.pt
episodes: 5
device: auto
