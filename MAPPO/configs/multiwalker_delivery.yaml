# Full native-geometry package delivery. Train with MAPPO.train_delivery.
project: rl-hero
entity: null
run_name: mappo-native-delivery-finetune
wandb_key: ""
seed: 42
init_checkpoint: MAPPO/checkpoints/best.pt
env_id: multiwalker_v9
n_walkers: 3
n_agents: 3
num_envs: 16
# Only extend the time budget: no shorter terrain, reward replacement or physics edits.
env_kwargs:
  max_cycles: 5000
max_steps_per_episode: 5000
render_mode: null
discretize_actions: false
action_bins: 3
share_policy: true
use_centralized_critic: true

# Preserve the moving baseline's actor function when warm-starting.
actor_hidden_sizes: [256, 128]
critic_hidden_sizes: [256, 128]
activation: relu
normalize_inputs: false
learning_rate: 0.0001
critic_learning_rate: 0.001
separate_grad_clipping: true
clip_value_loss: false
clip_coef: 0.2
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5
gamma: 0.99
gae_lambda: 0.95
target_kl: 0.02
anneal_lr: false

# Timesteps count independent-team parallel transitions, not agent transitions.
total_timesteps: 4000000
rollout_steps: 256
update_iterations: 5
minibatch_size: 1024
log_interval: 5
checkpoint_interval: 50
checkpoint_dir: MAPPO/checkpoints_delivery
inference_model_path: MAPPO/checkpoints_delivery/best.pt
best_window: 20
save_best: true
log_level: INFO
log_to_file: true
log_file: MAPPO/logs/delivery.log
log_to_console: true
episodes: 10
device: cpu
