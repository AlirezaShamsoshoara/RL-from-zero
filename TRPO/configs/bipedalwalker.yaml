# TRPO configuration for BipedalWalker-v3 (continuous control)
# A continuous Box(4) locomotion task: a classic, distinct continuous-control
# benchmark for trust-region policy gradients. It is harder than the toy
# classic-control envs, so it gets more timesteps and slightly wider networks.
project: rl-hero
entity: null
run_name: trpo-bipedalwalker
wandb_key: ""  # optional API key for wandb login (or set WANDB_API_KEY)
seed: 0

# Environment
env_id: BipedalWalker-v3
render_mode: null
num_envs: 8  # parallel envs for faster on-policy data collection
env_kwargs: {}

# Training
total_timesteps: 2000000
rollout_steps: 2048
gamma: 0.99
gae_lambda: 0.95
max_kl: 0.01
cg_iters: 10
cg_damping: 0.1
line_search_coef: 0.8
line_search_steps: 10
vf_lr: 0.0003
vf_iters: 5
entropy_coef: 0.0
normalize_advantages: true

# Model
hidden_sizes: [128, 128]
activation: tanh

# Logging & Checkpoints (intervals are in TRPO updates, not env steps)
log_interval: 1
checkpoint_interval: 20
checkpoint_dir: TRPO/checkpoints_bipedalwalker
save_best: true
log_level: INFO
log_to_file: true
log_file: TRPO/logs/trpo_bipedalwalker.log
log_to_console: true

# Inference
inference_model_path: TRPO/checkpoints_bipedalwalker/best.pt
episodes: 5
eval_deterministic: true  # Gaussian-mean greedy eval is fine for continuous control

# Misc
device: auto
