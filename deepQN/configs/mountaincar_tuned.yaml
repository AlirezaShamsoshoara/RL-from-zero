# Tuned native-reward MountainCar recipe; keep mountaincar.yaml as the raw baseline.
project: rl-hero
entity: null
run_name: dqn-mountaincar-tuned
wandb_key: ""

# Environment: unchanged dynamics and native rewards.
env_id: MountainCar-v0
render_mode: null
seed: 42
env_kwargs: {}

# Model: encode finite Box coordinates on comparable scales.
hidden_sizes: [128, 128]
activation: relu
normalize_observations: true

# Training
# Faster target propagation and a smaller optimizer step complement input scaling.
total_steps: 300000
learning_starts: 5000
train_freq: 4
batch_size: 64
buffer_size: 100000
gamma: 0.99
lr: 0.00025
target_update_interval: 250
max_grad_norm: 10.0
double_dqn: true

# Exploration
epsilon_start: 1.0
epsilon_end: 0.02
epsilon_decay_steps: 150000
eval_epsilon: 0.0

# Logging/checkpoints: environment transitions except target sync (gradient updates).
log_interval: 1000
checkpoint_interval: 5000
checkpoint_dir: deepQN/checkpoints_tuned
save_best: true
best_window: 10
max_steps_per_episode: 1000
log_level: INFO
log_to_console: true
log_to_file: true
log_file: deepQN/logs/dqn-tuned.log

# Inference
inference_model_path: deepQN/checkpoints_tuned/best.pt
episodes: 5
device: cpu
