# Controlled TD3 training profile; native MountainCarContinuous task unchanged.
project: rl-hero
entity: null
run_name: td3-mountaincar-balanced
wandb_key: ""
seed: 42
env_id: MountainCarContinuous-v0
env_kwargs: {}
render_mode: null
total_steps: 200000
start_steps: 10000
update_after: 10000
num_envs: 8
batch_size: 128
buffer_size: 250000
updates_per_step: 1
gamma: 0.99
tau: 0.005
policy_delay: 2
target_noise: 0.2
noise_clip: 0.5
exploration_noise: 0.2
# Per-idle-step pulse initiation probability, not overall random-action occupancy.
random_action_prob: 0.05
random_action_hold_min: 8
random_action_hold_max: 24
actor_lr: 0.0003
critic_lr: 0.0003
max_grad_norm: 10.0
hidden_sizes: [128, 128]
activation: relu
log_interval: 2000
checkpoint_interval: 20000
checkpoint_dir: TD3/checkpoints_balanced
inference_model_path: TD3/checkpoints_balanced/best.pt
best_window: 20
save_best: true
log_level: INFO
log_to_file: false
log_file: TD3/logs/td3-balanced.log
log_to_console: true
max_steps_per_episode: 999
episodes: 10
device: cpu
